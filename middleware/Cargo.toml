[package]
name = "preventa_middleware"
version = "0.1.0"
edition = "2021"
description = "Puente HubSpot <-> Bonita para la integración de preventa"

[lib]
name = "preventa_middleware"
path = "src/lib.rs"

[[bin]]
name = "preventa-middleware"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
axum = "0.7.7"
reqwest = { version = "0.12.8", default-features = false, features = ["json", "cookies", "rustls-tls"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
hmac = "0.12.1"
sha2 = "0.10.8"
base64 = "0.22.1"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6.2"
