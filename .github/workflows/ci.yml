name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  middleware-rust:
    name: Middleware (Rust) — build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: middleware
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: middleware
      # fmt/clippy ADVISORIOS por ahora (se escribió sin toolchain local). La validación real es cargo test.
      - name: fmt (advisorio)
        run: cargo fmt --check || true
      - name: clippy (advisorio)
        run: cargo clippy --all-targets || true
      - name: test (gate real)
        run: cargo test

  plataforma-bonita:
    name: Plataforma Bonita — compila conectores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compilar módulo de conectores
        run: mvn -q -B -f bonita-project/extensions/pom.xml package -DskipTests

  imagen-docker:
    name: Imagen Docker -> GHCR
    runs-on: ubuntu-latest
    needs: [middleware-rust]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./middleware
          push: true
          tags: ghcr.io/${{ github.repository }}/preventa-middleware:latest
