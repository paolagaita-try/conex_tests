# Configuracion del modulo de parametros PARA ESTE PROYECTO. Es un fichero del proyecto, no del modulo: vive en
# bonita-project/parametros/ y el assembly de la REST API extension lo lleva a la raiz de su zip, donde la API lo
# lee con el resourceProvider. Incorporar un proceso lo toca aqui (y su semilla en semillas/); el modulo no cambia.
# La plataforma lo lee en ISO-8859-1: se escribe solo en ASCII (lo no ASCII, como \uXXXX).
#
# familia.interna.actores: actores de proceso que cuentan como familia INTERNA, lista blanca separada por comas.
# La GENERA el arnes desde los actores del BPMN y su clasificacion por familia; no se edita a mano. Si falta o
# esta vacia, nadie es interno por su actor (solo la superadministracion, rol superAdministradorParametros, y las
# delegaciones vigentes) y todo lo interno responde 403: fallo cerrado.
# >>> generado: familia.interna.actores
# <<< generado: familia.interna.actores

# entorno: "demo" habilita POST parametros/semilla/restablecer, que devuelve la demo a su guion, sin doble
# control, antes de cada corrida. Con otro valor, o sin la clave, la accion no existe (404). Un despliegue real
# lo quita.
entorno=demo

# usos.conteo.clase: el proveedor de "expedientes por opcion" de GET parametros/usos. El modulo no conoce ningun
# proceso: lo nombra ESTE fichero, que es del proyecto. La clase vive en el adaptador del proyecto y lee, solo
# lectura, las tablas del BDM. Sin la clave no hay expedientes (lista vacia). El adaptador del proyecto
# (extensions/parametros-adaptador) trae esta clase; cada proceso declara en ella sus consultas.
usos.conteo.clase={{GRUPO}}.parametros.ConteoDeOpciones
