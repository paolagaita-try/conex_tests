# Configuracion de la API de consultas PARA ESTE PROYECTO. La plataforma lo lee en ISO-8859-1: solo ASCII.
#
# familia.cliente.actores / familia.interna.actores: listas blancas de actores de proceso separadas por comas. Las
# dos familias exigen estar implicado en el caso (lo inicio, o tiene o tuvo una tarea humana suya); ademas, la
# cliente, estar mapeado a un actor de la primera (en el proceso del caso) y la interna, a uno de la segunda. Las
# GENERA el arnes desde los actores del BPMN y su clasificacion por familia; no se editan a mano. Si faltan o estan
# vacias, nadie entra (fallo cerrado: 403).
# familia.cliente.tareas: las user tasks (ids del BPMN) del canal de cliente, lo unico cuyo veredicto de validacion
# puede leer la familia cliente.
# >>> generado: familias de actores
# <<< generado: familias de actores

# caso.variable: nombre de la variable de negocio del caso cuyo objeto sirve consultas/caso. Vacio: la unica variable
# de negocio que tenga el caso.
caso.variable=
