# REST API extension del modulo de parametros (19 recursos bajo /API/extension/parametros/).
# La resolucion de rutas de Bonita usa como clave "apiExtension|<metodo>|<todo lo que sigue a /API/extension/>",
# asi que una ruta con barras es una ruta mas. La autorizacion fina (superadministracion, familia interna) va en
# el codigo: estos permisos solo abren la puerta del perfil User y se FUSIONAN en su linea de
# custom-permissions-mapping (bonita-project/app/permisos/), nunca como linea nueva.
# Fichero en ASCII: la plataforma lo lee en ISO-8859-1 y una tilde en UTF-8 se pinta mal en el portal.
# Lo no ASCII, como \uXXXX.
name=custompage_parametros
displayName=Kit de par\u00e1metros (API)
description=Escritura transaccional con traza encadenada y lectura del kit de par\u00e1metros
contentType=apiExtension
apiExtensions=parametrosCambios,parametrosTraza,parametrosVerificacion,parametrosSemillaAplicar,parametrosSemillaDiferencias,parametrosAvisos,parametrosValores,parametrosDefiniciones,parametrosProcesos,parametrosPropuestas,parametrosPropuestasDecision,parametrosImportaciones,parametrosSemillaRestablecer,parametrosAdministracionValores,parametrosEditores,parametrosOrganizacion,parametrosDelegaciones,parametrosDelegar,parametrosUsos

