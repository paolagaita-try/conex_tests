##
# Comprobaciones dinamicas PROPIAS del proyecto (formato de Bonita: <METODO>|<recurso>=[<lista>], donde cada elemento
# es 'profile|<perfil>', 'user|<usuario>' o 'check|<Regla>'; <Regla> es una clase Groovy de app/permisos/reglas/).
#
# Solo ediciones Subscription (Teamwork, Efficiency, Performance, Enterprise): en Community se ignoran y
# tools/reglas.py y tools/studio.py las omiten con un aviso. Lo entre los marcadores lo genera el arnes desde
# bdm.md > Acceso al BDM > "Regla dinamica"; lo demas es del proyecto.
#
# Despliegue: tools/reglas.py copia este fichero a setup/platform_conf/initial/tenant_portal y las reglas a
# setup/platform_conf/initial/tenant_security_scripts del bundle; el journey arranca el bundle con
# BONITA_RUNTIME_AUTHORIZATION_DYNAMICCHECK_ENABLED=true solo si hay reglas que desplegar.
##
