##
# Permisos REST adicionales del proyecto (formato de Bonita: <type>|<identifier>=[<permission list>], type
# 'profile' o 'user'). Un espacio en el nombre de un perfil va como \u0020, p. ej. profile|Process\u0020manager=[...].
# Lo usan los dos runtimes, que lo aplican en el primer arranque:
#   - el bundle (-Pbundle): app/pom.xml lo copia a setup/platform_conf/initial/tenant_portal/;
#   - Docker QA (runtime/): el Dockerfile lo copia a /opt/bonita/setup/platform_conf/initial/tenant_portal/.
#
# Una sola linea por perfil: los permisos de cada REST API extension (los `permissions` de su page.properties)
# se FUSIONAN en ella, nunca como linea nueva (la ultima ganaria).
#
# parametros-api-extension (custompage_parametros): sin esta linea el filtro de autorizacion REST corta la API
# con 403 aunque quien llama sea de la familia interna. Quien lee o escribe lo decide despues el modulo.
##
#
# consultas-api-extension (custompage_consultas): `consultas_lectura` abre la puerta; la familia de actores y la
# pertenencia al caso las decide el codigo de la extension (403 para quien no es de la familia).
profile|User=[parametros_lectura, parametros_escritura, consultas_lectura]
