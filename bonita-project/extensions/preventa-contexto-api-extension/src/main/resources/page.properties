# REST API extension del contexto de preventa (1 recurso bajo /API/extension/preventa/).
# Lee de HubSpot, del lado servidor, el ticket y lo que cuelga de el (Negocio, empresa, contactos, owner) para que
# los formularios precarguen todo sin tener el token. El permiso `preventa_contexto_lectura` abre la puerta del
# perfil User (se FUSIONA en su linea de custom-permissions-mapping, bonita-project/app/permisos/).
# Fichero en ASCII: la plataforma lo lee en ISO-8859-1. Lo no ASCII, como \uXXXX.
name=custompage_preventaContexto
displayName=Contexto de preventa
description=Ticket, Negocio, empresa, contactos y owner de HubSpot para precargar los formularios
contentType=apiExtension
apiExtensions=preventaContexto

# GET preventa/contexto?ticketId=
preventaContexto.method=GET
preventaContexto.pathTemplate=preventa/contexto
preventaContexto.className=com.trycore.preventa.contexto.LecturaDelContexto
preventaContexto.permissions=preventa_contexto_lectura
