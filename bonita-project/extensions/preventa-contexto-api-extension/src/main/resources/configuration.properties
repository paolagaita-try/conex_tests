# Configuracion de la API del contexto de preventa. La plataforma lo lee en ISO-8859-1: solo ASCII.
#
# hubspot.urlBase: raiz de la API de HubSpot, sin barra final. Por defecto https://api.hubapi.com. Para el journey,
# el mock del arnes sirve las rutas bajo /hubspot (p. ej. http://localhost:8089/hubspot). La variable de entorno
# HUBSPOT_BASE_URL, si existe y no esta vacia, gana sobre este valor.
# El token NUNCA va aqui: solo la variable de entorno HUBSPOT_PRIVATE_APP_TOKEN del servidor Bonita.
hubspot.urlBase=https://api.hubapi.com
# Tiempos maximos en milisegundos (conexion y lectura) de cada llamada a HubSpot.
hubspot.timeoutMs=10000
# Owners que no son responsables validos (bots); se devuelven como owner=null. 88449388 = Trynion (bot).
owners.excluidos=88449388
# Maximo de contactos asociados que se leen (uno por llamada).
contactos.maximo=20
