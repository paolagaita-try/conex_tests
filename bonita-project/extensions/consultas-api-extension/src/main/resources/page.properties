# REST API extension de consultas del caso (2 recursos bajo /API/extension/consultas/).
# El unico camino por el que las pantallas leen el caso: la familia y la pertenencia al caso las decide el servidor en
# cada peticion (la proyeccion es la misma para las dos familias: los atributos escalares del objeto raiz). El permiso `consultas_lectura` solo abre la puerta del perfil User (se FUSIONA en su linea
# de custom-permissions-mapping, bonita-project/app/permisos/); quien lee que lo decide el codigo.
# Fichero en ASCII: la plataforma lo lee en ISO-8859-1. Lo no ASCII, como \uXXXX.
name=custompage_consultas
displayName=Consultas del caso
description=Lectura del caso con autorizacion por familia de actores en el servidor
contentType=apiExtension
apiExtensions=consultasCaso,consultasValidacion

# El objeto raiz del caso (la variable de negocio) con sus atributos escalares: GET consultas/caso?caseId=
consultasCaso.method=GET
consultasCaso.pathTemplate=consultas/caso
consultasCaso.className=com.trycore.consultas.LecturaDelCaso
consultasCaso.permissions=consultas_lectura

# Por que la tarea volvio: el veredicto de la ultima validacion del caso, en una lista cerrada de motivos neutros
consultasValidacion.method=GET
consultasValidacion.pathTemplate=consultas/validacion
consultasValidacion.className=com.trycore.consultas.ValidacionDelCaso
consultasValidacion.permissions=consultas_lectura
